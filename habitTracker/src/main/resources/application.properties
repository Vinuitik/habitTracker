spring.application.name=habitTracker

spring.data.mongodb.uri=${MONGO_URI}

#spring.data.mongodb.uri=mongodb://root:example@localhost:27017/habits?authSource=admin

server.port=8089

server.forward-headers-strategy=native

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

jwt.secret=${JWT_SECRET:changeme-at-least-32-chars-long-secret}
jwt.expiration-ms=86400000

# Per-user Drive offline-sync connect flow (habitTracker.sync.DriveService) — reuses the
# same Drive-scoped OAuth client already used by the mongo-backup service, distinct from
# GOOGLE_CLIENT_ID/SECRET above (that pair is login-only, scope openid,email,profile).
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:disabled}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:disabled}

# Trello REST API base (habitTracker.KPI.TrelloCardCountProvider). Only ever overridden in tests,
# to point at a local stub server instead of the real Trello host.
trello.api.base-url=${TRELLO_API_BASE_URL:https://api.trello.com}

# M12 proxy maintenance loop (habitTracker.KPI.ProxyHealthService): consecutive
# Optional.empty()/exception results from a KPI's ProxyProvider before its circuit breaker trips
# to proxyStatus=NEEDS_REPAIR and the nightly proxy-fill step stops calling it.
kpi.proxy.failure-threshold=${KPI_PROXY_FAILURE_THRESHOLD:3}

# mongo-backup internal API (habitTracker.Project.HttpTrelloBoardGateway). Token is required
# (startup fails if blank) except under the test-only "stub" profile.
trello.internal.base-url=${TRELLO_INTERNAL_BASE_URL:http://mongo-backup:8092}
trello.internal.token=${INTERNAL_API_TOKEN:}
