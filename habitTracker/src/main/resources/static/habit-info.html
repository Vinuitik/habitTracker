<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161920">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <title>HabitTracker — Habit Info</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/atoms/button.css">
  <link rel="stylesheet" href="/styles/atoms/input.css">
  <link rel="stylesheet" href="/styles/atoms/toast.css">
  <link rel="stylesheet" href="/styles/molecules/form-group.css">
  <link rel="stylesheet" href="/styles/organisms/topbar.css">
  <link rel="stylesheet" href="/styles/organisms/tabbar.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="/today" class="topbar__brand">HabitTracker</a>
      <nav class="topbar__nav"></nav>
      <form id="logout-form" action="/logout" method="post">
        <input type="hidden" id="logout-csrf" name="_csrf" value="">
        <button type="submit" class="topbar__signout">Sign out</button>
      </form>
    </div>
  </header>

  <main class="form-page">
    <div class="form-card">
      <div>
        <h1 class="form-card__title">Habit info</h1>
        <div class="form-card__subtitle">Why this habit matters and the smallest version of it.</div>
      </div>

      <form id="info-form" class="form-card__fields">
        <div class="form-group">
          <label class="form-group__label" for="habit-name">Habit name</label>
          <input class="input" type="text" id="habit-name" name="name" data-id="">
        </div>

        <div class="form-group">
          <label class="form-group__label" for="habit-description">Description</label>
          <textarea class="input" id="habit-description" name="description" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="two-minute-rule">2-minute rule</label>
          <textarea class="input" id="two-minute-rule" name="twoMinuteRule" rows="2"></textarea>
          <span class="form-group__hint">The version so small you can't say no — e.g. "put on running shoes".</span>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="habit-status">Status</label>
          <select class="input" id="habit-status" name="status">
            <option value="priority">Priority</option>
            <option value="maintaining">Maintaining</option>
            <option value="abandoned">Abandoned</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-group__label" for="habit-streak">Streak</label>
          <input class="input" type="number" inputmode="numeric" id="habit-streak" name="streak">
        </div>

        <div class="form-card__actions">
          <button type="submit" class="btn btn--primary btn--lg">Save</button>
          <a href="/habits/list" class="btn btn--ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/env.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/atoms/toast.js"></script>
  <script src="/js/registerSW.js"></script>
  <script src="/inputView/info.js"></script>
  <script>
    async function init() {
      if (!(await checkAuth())) return;
      initTopbar(window.location.pathname);

      const habitId = window.location.pathname.split('/').pop();
      const habit = await fetch(ENV.ENDPOINTS.HABIT_INFO(habitId), { credentials: 'include' }).then(r => r.json());

      document.getElementById('habit-name').value = habit.name || '';
      document.getElementById('habit-name').setAttribute('data-id', habit.id);
      document.getElementById('habit-description').value = habit.description || '';
      document.getElementById('two-minute-rule').value = habit.twoMinuteRule || '';
      document.getElementById('habit-status').value = habit.status || 'priority';
      document.getElementById('habit-streak').value = habit.streak || 0;
    }

    init();
  </script>
</body>
</html>
