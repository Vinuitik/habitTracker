<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitTracker — Today</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/atoms/button.css">
  <link rel="stylesheet" href="/styles/atoms/input.css">
  <link rel="stylesheet" href="/styles/molecules/form-group.css">
  <link rel="stylesheet" href="/styles/molecules/modal.css">
  <link rel="stylesheet" href="/styles/organisms/topbar.css">
  <link rel="stylesheet" href="/styles/atoms/toast.css">
  <link rel="stylesheet" href="/styles/pages/dashboard.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="/today" class="topbar__brand">HabitTracker</a>
      <nav class="topbar__nav"></nav>
      <form id="logout-form" action="/logout" method="post">
        <input type="hidden" id="logout-csrf" name="_csrf" value="">
        <button type="submit" class="topbar__signout">Sign out</button>
      </form>
    </div>
  </header>

  <!-- Main -->
  <main class="dashboard">
    <div class="dashboard__header">
      <div class="dashboard__label">Today</div>
      <div class="dashboard__date" id="today-date">—</div>
      <div class="dashboard__summary" id="today-summary"></div>
    </div>

    <!-- Confirm-inbox: KPI points a proxy provider wrote, sampled for manual review -->
    <section class="confirm-inbox" id="confirm-inbox" hidden>
      <div class="confirm-inbox__label">Confirm KPI values</div>
      <div class="confirm-inbox__list" id="confirm-inbox-list"></div>
    </section>

    <div class="habit-grid" id="habit-grid"></div>
  </main>

  <!-- FAB: add habit -->
  <a href="/habits/add" class="dashboard__fab" title="Add habit">+</a>

  <!-- All-done banner -->
  <div class="all-done-banner" id="all-done-banner">all habits done for today ✦</div>

  <!-- KPI Quick-Log Modal -->
  <div class="modal-overlay" id="kpiModal">
    <div class="modal-box">
      <div class="modal-box__header">
        <span class="modal-box__title" id="kpiModalTitle">Log KPIs</span>
        <button class="modal-box__close" type="button" onclick="closeKpiModal()">&#x2715;</button>
      </div>
      <form id="kpiModalForm" class="modal-box__fields">
        <div id="kpiModalFields"></div>
        <div class="modal-box__actions">
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn btn--ghost" onclick="closeKpiModal()">Skip</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/env.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/atoms/toast.js"></script>
  <script src="/js/offline/db.js"></script>
  <script src="/js/offline/crypto.js"></script>
  <script src="/js/offline/connectivity.js"></script>
  <script src="/js/offline/driveClient.js"></script>
  <script src="/js/offline/store.js"></script>
  <script src="/js/offline/outbox.js"></script>
  <script src="/js/registerSW.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    let allDoneFired = false;
    let currentDate = null; // the "today" date from the server, used when logging KPI values

    function openKpiModal(habitName, kpis) {
      document.getElementById('kpiModalTitle').textContent = `Log KPIs — ${habitName}`;
      document.getElementById('kpiModalFields').innerHTML = kpis.map(k => `
        <div class="form-group">
          <label class="form-group__label" for="kpi-${k.name}">${k.name}</label>
          ${k.description ? `<span class="form-group__hint">${k.description}</span>` : ''}
          <input class="input" type="number" step="any" id="kpi-${k.name}"
            data-kpi-name="${k.name}" placeholder="${k.defaultValue != null ? k.defaultValue : 'value'}">
        </div>`).join('');
      document.getElementById('kpiModal').classList.add('open');
    }

    function closeKpiModal() {
      document.getElementById('kpiModal').classList.remove('open');
      document.getElementById('kpiModalFields').innerHTML = '';
    }

    window.addEventListener('click', e => {
      if (e.target === document.getElementById('kpiModal')) closeKpiModal();
    });

    document.getElementById('kpiModalForm').addEventListener('submit', async e => {
      e.preventDefault();
      const inputs = [...document.querySelectorAll('#kpiModalFields input[data-kpi-name]')]
        .filter(inp => inp.value !== '');
      await Promise.all(inputs.map(inp =>
        Outbox.submitKpiValue(inp.dataset.kpiName, currentDate, inp.value)));
      if (window.Toast && inputs.length) Toast.show('KPIs logged');
      closeKpiModal();
    });

    // Fired right after a habit is marked complete. Silently no-ops if the habit has no
    // linked KPIs (GET /api/kpis/habits/{id}) — most habits won't.
    async function maybeShowKpiModal(card) {
      const kpis = await fetch(ENV.ENDPOINTS.KPI_BY_HABIT(card.dataset.id), { credentials: 'include' })
        .then(r => r.ok ? r.json() : [])
        .catch(() => []);
      if (kpis.length === 0) return;
      const habitName = card.querySelector('.habit-card__name').textContent;
      openKpiModal(habitName, kpis);
    }

    function checkAllComplete() {
      const cards = document.querySelectorAll('.habit-card');
      if (!cards.length) return;
      const allDone = [...cards].every(c => c.classList.contains('completed'));
      if (allDone && !allDoneFired) {
        allDoneFired = true;
        celebrateAllDone();
      }
    }

    function celebrateAllDone() {
      if (window.confetti) {
        confetti({ particleCount: 90, spread: 80, origin: { x: 0.5, y: 0.55 },
          colors: ['#6c86f5', '#4caf85', '#d4a017', '#e8eaf0'], ticks: 200 });
        setTimeout(() => confetti({ particleCount: 45, spread: 60,
          origin: { x: 0.25, y: 0.5 }, colors: ['#6c86f5', '#4caf85'], ticks: 160 }), 260);
        setTimeout(() => confetti({ particleCount: 45, spread: 60,
          origin: { x: 0.75, y: 0.5 }, colors: ['#d4a017', '#e8eaf0'], ticks: 160 }), 420);
      }
      const banner = document.getElementById('all-done-banner');
      if (banner) {
        banner.classList.add('visible');
        setTimeout(() => banner.classList.remove('visible'), 3500);
      }
    }

    const RING_R  = 22;
    const RING_C  = RING_R * 2 * Math.PI; // circumference

    function csrf() {
      const m = document.cookie.split('; ').find(r => r.startsWith('XSRF-TOKEN='));
      return m ? decodeURIComponent(m.split('=')[1]) : '';
    }

    function makeSVGRing(filled) {
      const offset = filled ? 0 : RING_C;
      return `
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle class="ring-track" cx="26" cy="26" r="${RING_R}" stroke-width="4"/>
          <circle class="ring-fill" cx="26" cy="26" r="${RING_R}" stroke-width="4"
            stroke-dasharray="${RING_C}"
            stroke-dashoffset="${offset}"/>
        </svg>
        <span class="ring-check">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3,9 7,13 15,5"/>
          </svg>
        </span>`;
    }

    function makeCard(h) {
      const card = document.createElement('div');
      card.className = 'habit-card' + (h.completed ? ' completed' : '');
      card.dataset.id = h.id;
      card.dataset.defaultMade = h.defaultMade;

      card.innerHTML = `
        <div class="habit-card__top">
          <div class="habit-card__ring">${makeSVGRing(h.completed)}</div>
          <div class="habit-card__info">
            <div class="habit-card__name">${h.name}</div>
            <div class="habit-card__streak" data-habit-id="${h.id}">— day streak</div>
          </div>
        </div>
        <input type="checkbox" class="habit-card__checkbox"
          data-habit-id="${h.id}"
          data-default-made="${h.defaultMade}"
          ${h.completed ? 'checked' : ''}>`;

      card.addEventListener('click', () => toggleCard(card));
      return card;
    }

    function setRing(card, filled) {
      const circle = card.querySelector('.ring-fill');
      if (circle) circle.style.strokeDashoffset = filled ? 0 : RING_C;
    }

    // Period-aware redness: one negative unit = one full missed period, so severity scales with
    // |streak| * frequency (days of neglect). K = 30 days maps to deepest red, so a 30-day habit is
    // fully red at -1 while a daily habit reddens gradually over ~a month. lightness: 50% -> 22%.
    function applyStreakColor(el, val, frequency) {
      if (val < 0) {
        const freq = (frequency && frequency > 0) ? frequency : parseInt(el.dataset.freq || '1', 10);
        const severity = Math.min(1, (Math.abs(val) * freq) / 30);
        el.classList.add('negative');
        el.style.color = `hsl(0, 88%, ${50 - 28 * severity}%)`;
      } else {
        el.classList.remove('negative');
        el.style.color = '';
      }
    }

    function tickStreak(el, fromVal, toVal, frequency) {
      if (!window.gsap) { el.textContent = toVal + ' day streak'; return; }
      const obj = { v: fromVal };
      gsap.to(obj, {
        v: toVal,
        duration: 0.4,
        ease: 'power2.out',
        onUpdate() { el.textContent = Math.round(obj.v) + ' day streak'; },
        onComplete() { applyStreakColor(el, toVal, frequency); }
      });
    }

    function toggleCard(card) {
      const checkbox  = card.querySelector('.habit-card__checkbox');
      const isDefaultMade = card.dataset.defaultMade === 'true';
      const nowChecked = !checkbox.checked;

      // Shame case: unchecking a defaultMade habit
      if (!nowChecked && isDefaultMade) {
        shameRemove(card);
        return;
      }

      checkbox.checked = nowChecked;
      card.classList.toggle('completed', nowChecked);
      setRing(card, nowChecked);

      if (nowChecked && window.gsap) {
        gsap.fromTo(card, { scale: 0.97 }, { scale: 1, duration: 0.15, ease: 'back.out(2)' });
      }

      const streakEl = card.querySelector('.habit-card__streak');
      const base = parseInt(streakEl.dataset.base || '0', 10);
      const display = nowChecked ? (base <= 0 ? 1 : base + 1) : base;

      // Local-first: the intent lands in IndexedDB (Store overlays it on every render) and the
      // network sync runs in the background — see js/offline/store.js + outbox.js.
      tickStreak(streakEl, base, display, parseInt(streakEl.dataset.freq || '1', 10));
      moveCard(card, nowChecked);
      updateSummary();
      if (nowChecked) { checkAllComplete(); maybeShowKpiModal(card); }
      else allDoneFired = false;
      Outbox.submitHabitComplete(card.dataset.id, nowChecked).catch(() => {
        checkbox.checked = !nowChecked;
        card.classList.toggle('completed', !nowChecked);
        setRing(card, !nowChecked);
      });
    }

    function moveCard(card, completed) {
      const grid = document.getElementById('habit-grid');
      if (completed) {
        grid.appendChild(card);
      } else {
        const first = grid.querySelector('.habit-card');
        grid.insertBefore(card, first);
      }
    }

    // Recompute "X of Y completed" from the current DOM state.
    // Called after every toggle and shame-removal so the count stays live.
    function updateSummary() {
      const summaryEl = document.getElementById('today-summary');
      if (!summaryEl) return;
      const cards = document.querySelectorAll('#habit-grid .habit-card');
      const total = cards.length;
      if (total === 0) {
        summaryEl.textContent = 'No habits scheduled for today.';
        return;
      }
      const done = document.querySelectorAll('#habit-grid .habit-card.completed').length;
      summaryEl.textContent = `${done} of ${total} completed`;
    }

    function shameRemove(card) {
      const checkbox = card.querySelector('.habit-card__checkbox');
      checkbox.disabled = true;
      card.classList.add('shame');

      dismissed.add(Number(card.dataset.id));
      Outbox.submitHabitComplete(card.dataset.id, false).then(() => {
        setTimeout(() => {
          card.classList.add('shame-out');
          card.addEventListener('animationend', () => { card.remove(); updateSummary(); }, { once: true });
        }, 420);
      }).catch(() => {
        card.classList.remove('shame');
        checkbox.disabled = false;
      });
    }

    const SOURCE_LABEL = {
      PROXY_TRELLO: 'Trello',
      PROXY_CAPABILITY: 'Proxy',
      AUTOFILL: 'Auto-fill',
      MANUAL: 'Manual'
    };

    function makePendingChip(item) {
      const chip = document.createElement('div');
      chip.className = 'confirm-chip';
      chip.dataset.kpiName = item.kpiName;
      chip.dataset.date = item.date;

      chip.innerHTML = `
        <div class="confirm-chip__info">
          <span class="confirm-chip__kpi">${item.kpiName}</span>
          <span class="confirm-chip__source">${SOURCE_LABEL[item.source] || item.source}</span>
          <span class="confirm-chip__date">${item.date}</span>
        </div>
        <div class="confirm-chip__value-row">
          <span class="confirm-chip__value" id="value-display">${item.value}</span>
          <input class="input input--sm confirm-chip__value-input" type="number" step="any"
            value="${item.value}" hidden>
        </div>
        <div class="confirm-chip__actions">
          <button type="button" class="btn btn--primary btn--sm" data-action="confirm">Confirm</button>
          <button type="button" class="btn btn--ghost btn--sm" data-action="edit">Edit</button>
          <button type="button" class="btn btn--primary btn--sm" data-action="save" hidden>Save</button>
          <button type="button" class="btn btn--ghost btn--sm" data-action="cancel" hidden>Cancel</button>
        </div>`;

      const valueDisplay = chip.querySelector('.confirm-chip__value');
      const valueInput    = chip.querySelector('.confirm-chip__value-input');
      const confirmBtn = chip.querySelector('[data-action="confirm"]');
      const editBtn     = chip.querySelector('[data-action="edit"]');
      const saveBtn     = chip.querySelector('[data-action="save"]');
      const cancelBtn   = chip.querySelector('[data-action="cancel"]');

      function setEditing(on) {
        valueDisplay.hidden = on;
        valueInput.hidden = !on;
        confirmBtn.hidden = on;
        editBtn.hidden = on;
        saveBtn.hidden = !on;
        cancelBtn.hidden = !on;
        if (on) { valueInput.value = item.value; valueInput.focus(); }
      }

      confirmBtn.addEventListener('click', async () => {
        confirmBtn.disabled = true;
        try {
          const res = await fetch(ENV.ENDPOINTS.KPI_CONFIRM(item.kpiName, item.date), {
            method: 'PUT', credentials: 'include',
            headers: { 'X-XSRF-TOKEN': csrf() }
          });
          if (!res.ok) throw new Error('confirm failed');
          if (window.Toast) Toast.show(`${item.kpiName} confirmed`);
          removeChip();
        } catch {
          confirmBtn.disabled = false;
          if (window.Toast) Toast.show('Failed to confirm — try again', 'error');
        }
      });

      editBtn.addEventListener('click', () => setEditing(true));
      cancelBtn.addEventListener('click', () => setEditing(false));

      saveBtn.addEventListener('click', async () => {
        const newValue = parseFloat(valueInput.value);
        if (Number.isNaN(newValue)) return;
        saveBtn.disabled = true;
        try {
          const res = await fetch(ENV.ENDPOINTS.KPI_EDIT_DATA(item.kpiName, item.date), {
            method: 'PUT', credentials: 'include',
            headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': csrf() },
            body: JSON.stringify({ value: newValue })
          });
          if (!res.ok) throw new Error('edit failed');
          if (window.Toast) Toast.show(`${item.kpiName} updated`);
          removeChip();
        } catch {
          saveBtn.disabled = false;
          if (window.Toast) Toast.show('Failed to save — try again', 'error');
        }
      });

      function removeChip() {
        chip.remove();
        const list = document.getElementById('confirm-inbox-list');
        if (list && list.children.length === 0) {
          document.getElementById('confirm-inbox').hidden = true;
        }
      }

      return chip;
    }

    async function loadConfirmInbox() {
      const pending = await fetch(ENV.ENDPOINTS.KPI_PENDING, { credentials: 'include' })
        .then(r => r.ok ? r.json() : [])
        .catch(() => []);

      const section = document.getElementById('confirm-inbox');
      const list = document.getElementById('confirm-inbox-list');
      if (!pending || pending.length === 0) { section.hidden = true; return; }

      list.innerHTML = '';
      pending.forEach(item => list.appendChild(makePendingChip(item)));
      section.hidden = false;
    }

    const dismissed = new Set(); // shame-removed this session; a refresh must not bring them back

    function visibleHabits(data) {
      return (data.habits || []).filter(h => !dismissed.has(h.id));
    }

    function signature(date, pairs) {
      return date + '|' + pairs.sort((a, b) => a[0] - b[0]).map(p => p[0] + ':' + p[1]).join(',');
    }
    function dataSig(data) {
      return signature(data.date, visibleHabits(data).map(h => [h.id, h.completed ? 1 : 0]));
    }
    function domSig() {
      const cards = [...document.querySelectorAll('#habit-grid .habit-card')];
      return signature(currentDate, cards.map(c => [Number(c.dataset.id), c.classList.contains('completed') ? 1 : 0]));
    }

    function applyStreaks(streaks) {
      (streaks || []).forEach(({ key, value, frequency }) => {
        const card = document.querySelector(`.habit-card[data-id="${key}"]`);
        if (!card) return;
        const checkbox = card.querySelector('.habit-card__checkbox');
        const streakEl = card.querySelector('.habit-card__streak');
        const freq     = (frequency && frequency > 0) ? frequency : 1;
        const display  = checkbox.checked ? (value <= 0 ? 1 : value + 1) : value;
        streakEl.dataset.base = value;
        streakEl.dataset.freq = freq;
        streakEl.textContent  = display + ' day streak';
        applyStreakColor(streakEl, display, freq);
      });
    }

    let streaksCache = [];

    async function loadStreaks(habits) {
      const ids = habits.map(h => String(h.id));
      // Origin-down (530) answers with Cloudflare's HTML error page, not JSON; skip on non-ok.
      const fresh = await fetch(ENV.ENDPOINTS.HABITS_STREAKS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': csrf() },
        body: JSON.stringify(ids)
      }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (fresh) {
        streaksCache = fresh;
        Store.setStreaks(fresh);
        applyStreaks(fresh);
      }
    }

    // Renders the merged local view (snapshot + unsent intents). No-op if the DOM already matches.
    function renderToday(data, animate) {
      const grid = document.getElementById('habit-grid');
      const habits = visibleHabits(data);

      if (currentDate === data.date && grid.querySelector('.habit-card') && domSig() === dataSig(data)) return false;

      currentDate = data.date;
      document.getElementById('today-date').textContent =
        new Date(data.date + 'T00:00:00').toLocaleDateString('en-US',
          { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      grid.innerHTML = '';
      if (habits.length === 0) {
        grid.innerHTML = `
          <div class="dashboard__empty">
            <h2>Nothing due today</h2>
            <p>All caught up, or no habits created yet.</p>
            <a href="/habits/add" class="btn btn--primary btn--lg">Create your first habit</a>
          </div>`;
        document.getElementById('today-summary').textContent = 'No habits scheduled for today.';
        return true;
      }

      [...habits].sort((a, b) => a.completed - b.completed).forEach(h => grid.appendChild(makeCard(h)));
      updateSummary();
      applyStreaks(streaksCache);

      if (animate && window.gsap) {
        gsap.to('.habit-card', { opacity: 1, y: 0, duration: 0.25, stagger: 0.05, ease: 'power2.out' });
      } else {
        document.querySelectorAll('.habit-card').forEach(c => {
          c.style.opacity = '1';
          c.style.transform = 'none';
        });
      }
      return true;
    }

    async function showLocal(animate) {
      const data = await Store.getToday();
      if (!data) return false;
      renderToday(data, animate);
      return true;
    }

    async function init() {
      // Paint from local state first — no network on the path to first render.
      const cached = await Store.getStreaks();
      if (cached) streaksCache = cached;
      const hadLocal = await showLocal(true);

      if (!(await checkAuth())) return;

      initTopbar(ENV.ROUTES.HOME);
      loadConfirmInbox();

      // Any later pull (flush, refocus, interval) re-renders only if the merged view changed.
      Store.onChange(() => showLocal(false));

      const fresh = await Store.refresh();
      if (!hadLocal && !fresh) {
        document.getElementById('today-date').textContent = 'Offline';
        document.getElementById('habit-grid').innerHTML = `
          <div class="dashboard__empty">
            <h2>You're offline</h2>
            <p>No data saved on this device yet. Open the app once while the server is up.</p>
          </div>`;
        document.getElementById('today-summary').textContent = 'Offline.';
        return;
      }
      if (fresh) await showLocal(!hadLocal);

      const data = await Store.getToday();
      if (data) loadStreaks(visibleHabits(data));
    }

    init();
  </script>
</body>
</html>
