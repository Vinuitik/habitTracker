<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161920">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <title>HabitTracker — Projects</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/reset.css">
  <link rel="stylesheet" href="/styles/atoms/button.css">
  <link rel="stylesheet" href="/styles/atoms/input.css">
  <link rel="stylesheet" href="/styles/atoms/toast.css">
  <link rel="stylesheet" href="/styles/atoms/badge.css">
  <link rel="stylesheet" href="/styles/atoms/icon.css">
  <link rel="stylesheet" href="/styles/atoms/progress.css">
  <link rel="stylesheet" href="/styles/atoms/dnd.css">
  <link rel="stylesheet" href="/styles/molecules/card.css">
  <link rel="stylesheet" href="/styles/molecules/form-group.css">
  <link rel="stylesheet" href="/styles/molecules/modal.css">
  <link rel="stylesheet" href="/styles/molecules/menu.css">
  <link rel="stylesheet" href="/styles/molecules/board-tile.css">
  <link rel="stylesheet" href="/styles/molecules/card-tile.css">
  <link rel="stylesheet" href="/styles/molecules/composer.css">
  <link rel="stylesheet" href="/styles/molecules/list-column.css">
  <link rel="stylesheet" href="/styles/organisms/topbar.css">
  <link rel="stylesheet" href="/styles/organisms/board.css">
  <link rel="stylesheet" href="/styles/organisms/drawer.css">
  <link rel="stylesheet" href="/styles/organisms/tabbar.css">
  <link rel="stylesheet" href="/styles/pages/projects.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="/today" class="topbar__brand">HabitTracker</a>
      <nav class="topbar__nav"></nav>
      <form id="logout-form" action="/logout" method="post">
        <input type="hidden" id="logout-csrf" name="_csrf" value="">
        <button type="submit" class="topbar__signout">Sign out</button>
      </form>
    </div>
  </header>

  <main class="projects-page" id="projects-page">
    <div class="projects-view" id="projects-view"></div>
  </main>

  <!-- Create -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-box">
      <div class="modal-box__header">
        <span class="modal-box__title">New Project</span>
        <button class="modal-box__close" data-close aria-label="Close">&#x2715;</button>
      </div>
      <form id="create-form" class="modal-box__fields">
        <div class="form-group">
          <label class="form-group__label" for="p-name">Name</label>
          <input class="input" id="p-name" required maxlength="80" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-group__label" for="p-desc">Description</label>
          <textarea class="input" id="p-desc" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label class="form-group__label" for="p-board">Existing Trello board ID</label>
          <input class="input" id="p-board" autocomplete="off" placeholder="Leave empty to create a new board">
          <span class="form-group__hint">Empty = a new Trello board is created for this project.</span>
        </div>
        <div class="form-group__error" id="create-error" hidden></div>
        <div class="modal-box__actions">
          <button type="submit" class="btn btn--primary" id="create-submit">Create</button>
          <button type="button" class="btn btn--ghost" data-close>Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import from Trello -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-box">
      <div class="modal-box__header">
        <span class="modal-box__title">Import from Trello</span>
        <button class="modal-box__close" data-close aria-label="Close">&#x2715;</button>
      </div>
      <div class="check-list" id="import-list"></div>
      <div class="form-group__error" id="import-error" hidden></div>
      <div class="modal-box__actions">
        <button class="btn btn--primary" id="import-submit" disabled>Import selected</button>
        <button class="btn btn--ghost" data-close>Cancel</button>
      </div>
    </div>
  </div>

  <!-- Card detail (editable) -->
  <div class="modal-overlay" id="card-modal">
    <div class="modal-box modal-box--wide">
      <div class="modal-box__header">
        <span class="modal-box__title" id="card-modal-title"></span>
        <button class="modal-box__close" data-close aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-box__fields" id="card-modal-body"></div>
    </div>
  </div>

  <!-- Plan with AI drawer -->
  <aside class="drawer" id="plan-drawer" aria-label="Plan with AI">
    <div class="drawer__header">
      <span class="drawer__title">Plan with AI</span>
      <button class="modal-box__close" data-close aria-label="Close">&#x2715;</button>
    </div>
    <div class="drawer__body">
      <div class="form-group">
        <label class="form-group__label" for="plan-desc">Describe a problem</label>
        <textarea class="input" id="plan-desc" rows="4" placeholder="What do you want to build or solve? The agent breaks it into cards."></textarea>
      </div>
      <div class="planner__row">
        <button class="btn btn--primary btn--sm" id="plan-draft">Draft plan</button>
        <span class="planner__status" id="plan-status"></span>
      </div>
      <div class="planner__result" id="plan-result" hidden></div>
    </div>
  </aside>

  <!-- Two-step delete -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <div class="modal-box__header">
        <span class="modal-box__title" id="delete-title">Delete project</span>
        <button class="modal-box__close" data-close aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-box__fields" id="delete-step-1">
        <p class="projects-warn" id="delete-warning"></p>
        <div class="modal-box__actions">
          <button class="btn btn--danger" id="delete-continue">Continue</button>
          <button class="btn btn--ghost" data-close>Cancel</button>
        </div>
      </div>
      <form class="modal-box__fields" id="delete-step-2" hidden>
        <div class="form-group">
          <label class="form-group__label" for="delete-confirm-name">Type the project name to confirm</label>
          <input class="input" id="delete-confirm-name" autocomplete="off">
          <span class="form-group__hint" id="delete-countdown"></span>
        </div>
        <div class="form-group__error" id="delete-error" hidden></div>
        <div class="modal-box__actions">
          <button type="submit" class="btn btn--danger" id="delete-submit" disabled>Delete forever</button>
          <button type="button" class="btn btn--ghost" data-close>Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/env.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/registerSW.js"></script>
  <script src="/js/atoms/toast.js"></script>
  <script src="/js/atoms/dom.js"></script>
  <script src="/js/atoms/api.js"></script>
  <script src="/js/atoms/icons.js"></script>
  <script src="/js/atoms/menu.js"></script>
  <script src="/js/atoms/dnd.js"></script>
  <script src="/js/molecules/connect-panel.js"></script>
  <script src="/js/molecules/card-tile.js"></script>
  <script src="/js/molecules/composer.js"></script>
  <script src="/js/organisms/board.js"></script>
  <script src="/js/organisms/card-modal.js"></script>
  <script src="/js/organisms/plan-drawer.js"></script>
  <script src="/js/pages/projects.js"></script>
</body>
</html>
