version: '3.8'

services:
  mongodbHabit:
    image: mongo:7
    container_name: mongodbHabit
    command: mongod --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: habits
    mem_limit: 512m
    restart: unless-stopped

  javaapp:
    build:
      context: ./habitTracker
      dockerfile: Dockerfile
    container_name: javaapp
    depends_on:
      - mongodbHabit
    environment:
      MONGO_URI: mongodb://root:example@mongodbHabit:27017/habits?authSource=admin
      TZ: Europe/London
      JAVA_TOOL_OPTIONS: -Xmx256m -Xms64m
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env / .env.example)}
      # Per-user Drive offline-sync connect flow — reuses the same Drive-scoped OAuth
      # client already used by mongo-backup (drive.file access), just for a different
      # purpose. Optional: a user simply can't connect Drive if this is unset.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-disabled}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-disabled}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped

  # KPI capability sandbox sidecar (M7). The ONLY service with the Docker socket: that socket is
  # host-root-equivalent, so it is kept off javaapp. No published ports; javaapp reaches it at
  # http://sandbox:8090. See sandbox/FLOWS.md.
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: sandbox
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-4}
      # Egress for runners that declare network hosts. Unset/short => networked runs fail closed.
      SANDBOX_EGRESS_SECRET: ${SANDBOX_EGRESS_SECRET:-}
      # Real docker name of the internal network below (compose would otherwise prefix the project).
      SANDBOX_EGRESS_NETWORK: habit_sandbox_egress
      EGRESS_PROXY_HOST: egress-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    restart: unless-stopped

  # Forward proxy for sandbox runners (stdlib Python, NO docker socket, no published ports). The only
  # service besides ephemeral runners on the internal network; also on the default network for internet.
  # Verifies the sidecar's HMAC token and allows only exact hostnames in it. See egress-proxy/FLOWS.md.
  egress-proxy:
    build:
      context: ./egress-proxy
      dockerfile: Dockerfile
    container_name: egress-proxy
    environment:
      SANDBOX_EGRESS_SECRET: ${SANDBOX_EGRESS_SECRET:-}
    networks:
      default:
      sandbox_egress:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 48m
    restart: unless-stopped

  mongo-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: mongo-backup
    depends_on:
      - mongodbHabit
    environment:
      MONGO_HOST: mongodbHabit
      MONGO_USER: root
      MONGO_PASS: example
      MONGO_DB: habits
      MONGO_AUTH_DB: admin
      TZ: Europe/London
      # Backup → Drive (OAuth). Fail fast rather than run a backup-less container:
      # a silent no-op here is exactly how backups died unnoticed before.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID in .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET in .env}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:?set GOOGLE_OAUTH_REFRESH_TOKEN in .env}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env — it is the only key to your backups}
      BACKUP_FOLDER_NAME: ${BACKUP_FOLDER_NAME:-HabitBackups v2}
      BACKUP_KEEP: ${BACKUP_KEEP:-5}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      TRELLO_API_KEY: ${TRELLO_API_KEY:-}
      TRELLO_TOKEN: ${TRELLO_TOKEN:-}
      TRELLO_CRON_BOARD_ID: ${TRELLO_CRON_BOARD_ID:-}
      TRELLO_CRON_BOARD_NAME: ${TRELLO_CRON_BOARD_NAME:-}
    volumes:
      # Claude CLI subscription login. Read-write: the CLI refreshes tokens in place.
      - ${CLAUDE_HOME:-~/.claude}:/root/.claude
    mem_limit: 768m
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    depends_on:
      javaapp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      MCP_TOKEN: ${MCP_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    restart: unless-stopped

  cloudflared:
    build:
      context: ./cloudflared
      dockerfile: Dockerfile
    dns:
      - 1.1.1.1
      - 1.0.0.1
    container_name: cloudflared
    depends_on:
      - caddy
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 20241 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # No route out: runners attached here can reach only egress-proxy. Explicit name so the sidecar can
  # pass it to `docker run --network` (compose would prefix the project name otherwise).
  sandbox_egress:
    name: habit_sandbox_egress
    internal: true

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
